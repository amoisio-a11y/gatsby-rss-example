name: Päivitä RSS-syötteet

on:
  schedule:
    # Ajetaan 6 tunnin välein. Muokkaa tarpeen mukaan (cron on UTC-aikaa).
    - cron: "15 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-feeds
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hae repo
        uses: actions/checkout@v4

      - name: Asenna Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Asenna Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Rakenna RSS-syötteet
        run: npm run build

      - name: Committaa muuttuneet syötteet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/uutiset.xml docs/tapahtumat.xml
          if git diff --cached --quiet; then
            echo "Ei muutoksia, ei committia."
          else
            git commit -m "Päivitä RSS-syötteet ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
